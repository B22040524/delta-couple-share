<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#1d1e22">

  <title>想和你建立情侣关系</title>
  <meta name="description"
        content="和我成为情侣，让QQ帮我们记录每一点滴">

  <meta property="og:type" content="website">
  <meta property="og:title" content="想和你建立情侣关系">
  <meta property="og:description"
        content="和我成为情侣，让QQ帮我们记录每一点滴">
  <meta property="og:image" content="{{ image_url }}">
  {% if page_url %}
  <meta property="og:url" content="{{ page_url }}">
  <link rel="canonical" href="{{ page_url }}">
  {% endif %}

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 16% 15%, rgba(255,85,127,.14), transparent 34%),
        radial-gradient(circle at 84% 80%, rgba(102,118,255,.13), transparent 38%),
        #17181d;
      color: #fff;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 22px;
    }
    .card {
      width: min(100%, 420px);
      border-radius: 26px;
      padding: 26px;
      background: rgba(35,36,40,.97);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 26px 80px rgba(0,0,0,.35);
      text-align: center;
    }
    .icon {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 19px;
      border-radius: 24px;
      background: linear-gradient(145deg, #ff6d93, #ff416f);
      font-size: 43px;
      font-weight: 900;
      box-shadow: 0 16px 34px rgba(255,65,111,.25);
    }
    h1 { margin: 0; font-size: 24px; line-height: 1.35; }
    .desc {
      margin: 11px 0 22px;
      color: #b9bbc3;
      font-size: 15px;
      line-height: 1.65;
    }
    .open {
      width: 100%;
      min-height: 58px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(135deg, #ff6d93, #ff416f);
      text-decoration: none;
      font-weight: 800;
      font-size: 17px;
    }
    .store {
      display: inline-block;
      margin-top: 17px;
      color: #9da0aa;
      font-size: 13px;
    }
    .tip {
      margin: 18px 2px 0;
      padding-top: 17px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #777a84;
      font-size: 12px;
      line-height: 1.65;
    }
    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #17181d;
      z-index: 5;
      transition: opacity .2s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.13);
      border-top-color: #ff557f;
      animation: spin .8s linear infinite;
    }
    body.show-fallback .loading {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" aria-label="正在尝试打开三角洲行动">
    <div class="spinner"></div>
  </div>

  <main class="card">
    <div class="icon">♥</div>
    <h1>想和你建立情侣关系</h1>
    <p class="desc">
      正在尝试打开《三角洲行动》。如果 QQ 阻止自动启动，
      请点击下面的按钮。
    </p>

    <a id="openGame" class="open" href="{{ intent_url }}">
      打开三角洲行动
    </a>

    <a class="store" href="{{ store_url }}">
      没有安装？前往应用宝下载
    </a>

    <p class="tip">
      浏览器不能绕过 QQ 或 Android 的安全限制。
      页面会先自动尝试，失败后保留手动打开按钮。
    </p>
  </main>

  <script>
    const intentUrl = {{ intent_url|tojson }};
    let pageHidden = false;

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) pageHidden = true;
    });

    try {
      window.location.href = intentUrl;
    } catch (_) {}

    window.setTimeout(() => {
      if (!pageHidden) {
        document.body.classList.add("show-fallback");
      }
    }, 1000);
  </script>
</body>
</html>
